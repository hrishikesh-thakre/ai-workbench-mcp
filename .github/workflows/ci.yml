name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  self-validation:
    name: Repo self-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Run scaffold validation
        run: python tools/validate_run.py --project ai_workbench_mcp --profile scaffold --out-dir runs/ci_scaffold

      - name: Check diff whitespace
        run: git diff --check
