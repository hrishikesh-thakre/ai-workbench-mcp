name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  self-validation:
    name: Repo self-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,publish]"

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Run scaffold validation
        run: python tools/validate_run.py --project ai_workbench_mcp --profile scaffold --out-dir runs/ci_scaffold

      - name: Render PR gate artifact
        run: python tools/pr_gate.py --run-dir runs/ci_scaffold --out runs/pr_gate/pr_comment.md --json-out runs/pr_gate/pr_decision.json

      - name: Upload PR gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: workbench-pr-gate
          path: |
            runs/pr_gate/pr_comment.md
            runs/pr_gate/pr_decision.json

      - name: Build package artifacts
        run: python -m build

      - name: Check package artifacts
        run: python -m twine check dist/*

      - name: Smoke installed wheel
        run: |
          python -m pip install --force-reinstall "$(ls dist/*.whl | head -n 1)"
          python -c "import ai_workbench_mcp; from ai_workbench_mcp import server; from ai_workbench_mcp.tools import model_select, validate_run"

      - name: Check diff whitespace
        run: git diff --check
