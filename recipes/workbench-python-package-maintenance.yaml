version: "1.0.0"
title: "Workbench Python Package Maintenance"
description: "Run a bounded Python package maintenance task through AI Workbench acceptance with the python_package_maintenance validation profile."

parameters:
  - key: project
    input_type: string
    requirement: optional
    description: "Project key from configs/projects.yaml."
    default: "ai_workbench_mcp"
  - key: run_dir
    input_type: string
    requirement: user_prompt
    description: "Evidence directory for this package maintenance run, for example runs/20260512_package_maintenance."
  - key: task
    input_type: string
    requirement: user_prompt
    description: "Bounded Python package maintenance task Goose should perform."
  - key: task_type
    input_type: select
    requirement: optional
    description: "Workbench routing task type."
    default: "implement"
    options:
      - "implement"
      - "test"
      - "investigate"
  - key: risk
    input_type: select
    requirement: optional
    description: "Risk level for routing and quality-gate policy."
    default: "medium"
    options:
      - "low"
      - "medium"
      - "high"
  - key: validation_profile_override
    input_type: string
    requirement: optional
    description: "Optional explicit validation profile override from configs/validation_profiles.yaml. Leave empty to run advisory policy-pack auto-selection."
    default: ""
  - key: routing_feedback_path
    input_type: string
    requirement: optional
    description: "Optional analytics report used for advisory routing feedback."
    default: "runs/_reports/run_metrics.json"
  - key: prompt
    input_type: string
    requirement: optional
    description: "Approved prompt name used for routing metadata."
    default: "implement_request_change_request"
  - key: complexity_score
    input_type: number
    requirement: optional
    description: "Optional 1-25 complexity score for model routing."
    default: "8"

extensions:
  - type: builtin
    name: developer
    description: "Goose developer tools for shell commands, file reads, and edits."
  - type: stdio
    name: "AI Workbench MCP"
    cmd: "ai-workbench mcp serve"
    args: []
    timeout: 300
    bundled: false
    description: "AI Workbench routing, validation, quality gate, and run analytics."
    available_tools:
      - "workbench_open_run"
      - "workbench_select_policy_pack"
      - "workbench_select_model"
      - "workbench_record_execution"
      - "workbench_validate_run"
      - "workbench_quality_gate"
      - "workbench_analyze_runs"

instructions: |
  You are running a Python package maintenance AI Workbench acceptance workflow through Goose.

  Use the AI Workbench MCP tools as the source of truth for routing, validation, quality gate decisions, and analytics. Do not claim the run is accepted unless deterministic validation and the quality gate both support that conclusion.

  Policy-pack selector output and selected_validation_profile are setup guidance only. They are not acceptance evidence and do not replace deterministic validation or the quality gate.

  Boundaries:
  - Keep changes bounded to package maintenance concerns: Python package metadata, importability, tests, Workbench tools, MCP package code, configs, recipes, and public docs needed for the task.
  - Do not add private run history, provider secrets, personal machine paths, broad UI/provider plumbing, or target-repo-specific configuration.
  - Preserve Goose as the execution surface and keep Workbench core logic runtime-agnostic.
  - If the requested task requires deployment, secret handling, destructive migration, or unrelated product work, stop and report that this package maintenance recipe is the wrong execution profile.

  Workflow:
  1. Call workbench_open_run with project="{{ project }}", task="{{ task }}", run_dir="{{ run_dir }}", prompt="{{ prompt }}", risk="{{ risk }}", and recipe="workbench-python-package-maintenance.yaml".
  2. Determine selected_validation_profile for this run. If validation_profile_override="{{ validation_profile_override }}" is non-empty, use that value and skip advisory auto-selection. Otherwise call workbench_select_policy_pack with task_text="{{ task }}", task_type="{{ task_type }}", prompt="{{ prompt }}", and risk="{{ risk }}" before model selection, then use its recommended_validation_profile. If the selector cannot provide one, stop and ask for an explicit validation_profile_override instead of guessing from recipe defaults.
  3. Call workbench_select_model with project="{{ project }}", task_type="{{ task_type }}", risk="{{ risk }}", validation_strength="strong", prompt="{{ prompt }}", complexity_score={{ complexity_score }}, recipe="workbench-python-package-maintenance.yaml", validation_profile=selected_validation_profile, routing_feedback_path="{{ routing_feedback_path }}", and out="{{ run_dir }}/model_selection.json".
  4. Perform the requested Python package maintenance task: {{ task }}
  5. Inspect the current worktree changes and build the exact changed files list for this task. Exclude Workbench run evidence under runs/, and do not omit extra worktree changes.
  6. Call workbench_record_execution exactly once with project="{{ project }}", run_dir="{{ run_dir }}", run_status="completed", files_touched set to the exact changed files list, and response_text set to a concise implementation summary containing Summary, Files touched, Validation run, and Risks / follow-ups sections.
     If workbench_record_execution returns ok=true and status="response_captured", do not call workbench_record_execution again; continue to deterministic validation.
  7. Call workbench_validate_run with project="{{ project }}", profile=selected_validation_profile, out_dir="{{ run_dir }}", and changed_files set to the same exact changed files list. For explicit override runs, this is equivalent to profile="{{ validation_profile_override }}". Focused change profiles require non-empty changed files that exactly match current worktree diff evidence.
  8. Call workbench_quality_gate with project="{{ project }}", run_dir="{{ run_dir }}", mode="auto", and risk="{{ risk }}".
  9. If the quality gate returns review_required or revision_required, follow its next_action and do not mark the task accepted.
  10. Call workbench_analyze_runs with runs_dir="runs" and out_dir="runs/_reports" after validation and quality gate artifacts exist.

prompt: |
  Task: {{ task }}

  Run directory: {{ run_dir }}
  Project: {{ project }}
  Task type: {{ task_type }}
  Risk: {{ risk }}
  Validation profile override: {{ validation_profile_override }}

  Start by opening the Workbench run, then determine the selected validation profile from the explicit override or advisory policy-pack selector before model selection. Complete the bounded Python package maintenance work, record execution evidence with Workbench, validate it with the same selected profile, run the quality gate, and summarize the final Workbench envelope statuses.

activities:
  - "Run an accepted Python package maintenance workflow for: {{ task }}"
  - "Validate and quality-gate the evidence in {{ run_dir }}"
