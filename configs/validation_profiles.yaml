profiles:
  scaffold:
    description: Installable public CLI smoke validation for the Workbench package.
    commands:
      - name: cli_help
        command: python -m ai_workbench_mcp.cli --help
        cwd: .
        required: true
        weight: 1.0
      - name: mcp_serve_help
        command: python -m ai_workbench_mcp.cli mcp serve --help
        cwd: .
        required: true
        weight: 1.0
      - name: bootstrap_help
        command: python -m ai_workbench_mcp.cli bootstrap --help
        cwd: .
        required: true
        weight: 1.0
      - name: demo_help
        command: python -m ai_workbench_mcp.cli demo --help
        cwd: .
        required: true
        weight: 1.0
      - name: validate_help
        command: python -m ai_workbench_mcp.cli validate --help
        cwd: .
        required: true
        weight: 1.0
      - name: gate_help
        command: python -m ai_workbench_mcp.cli gate --help
        cwd: .
        required: true
        weight: 1.0
      - name: pr_gate_help
        command: python -m ai_workbench_mcp.cli pr-gate --help
        cwd: .
        required: true
        weight: 1.0
      - name: supervisor_status_help
        command: python -m ai_workbench_mcp.cli supervisor status --help
        cwd: .
        required: true
        weight: 1.0
      - name: setup_codex_help
        command: python -m ai_workbench_mcp.cli setup codex --help
        cwd: .
        required: true
        weight: 1.0
      - name: reports_show_help
        command: python -m ai_workbench_mcp.cli reports show --help
        cwd: .
        required: true
        weight: 1.0
      - name: opencode_watch_help
        command: python -m ai_workbench_mcp.cli opencode watch --help
        cwd: .
        required: true
        weight: 1.0
      - name: model_select_module_help
        command: python -m ai_workbench_mcp.tools.model_select --help
        cwd: .
        required: true
        weight: 1.0
      - name: model_handoff_module_help
        command: python -m ai_workbench_mcp.tools.model_handoff --help
        cwd: .
        required: true
        weight: 1.0
      - name: run_log_module_help
        command: python -m ai_workbench_mcp.tools.run_log --help
        cwd: .
        required: true
        weight: 1.0
      - name: run_analyze_module_help
        command: python -m ai_workbench_mcp.tools.run_analyze --help
        cwd: .
        required: true
        weight: 1.0
      - name: golden_eval_module_help
        command: python -m ai_workbench_mcp.tools.golden_eval --help
        cwd: .
        required: true
        weight: 1.0
      - name: policy_pack_select_module_help
        command: python -m ai_workbench_mcp.tools.policy_pack_select --help
        cwd: .
        required: true
        weight: 1.0
      - name: model_registry_override_support
        command: python -c "from ai_workbench_mcp.tools.model_select import load_model_registry_with_source; registry=load_model_registry_with_source(); assert isinstance(registry.source['local_override_loaded'], bool)"
        cwd: .
        required: true
        weight: 1.0
      - name: event_ledger_import_smoke
        command: python -c "from ai_workbench_mcp import events; assert hasattr(events, 'build_event'); assert hasattr(events, 'response_with_event')"
        cwd: .
        required: true
        weight: 1.0

  run_signoff:
    description: Acceptance sign-off for a run folder with captured output.
    commands:
      - name: validate_help
        command: python -m ai_workbench_mcp.cli validate --help
        cwd: .
        required: true
        weight: 1.0
      - name: gate_help
        command: python -m ai_workbench_mcp.cli gate --help
        cwd: .
        required: true
        weight: 1.0
    required_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    non_empty_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_checks:
      - model_output_status

  tiny_python_fix:
    description: Focused validation profile for the intentionally broken tiny Python fixture demo.
    commands:
      - name: tiny_python_fix_tests
        command: python -m unittest discover -s examples/tiny-python-fix -p "test_*.py"
        cwd: .
        required: true
        weight: 1.0
      - name: validate_help
        command: python -m ai_workbench_mcp.cli validate --help
        cwd: .
        required: true
        weight: 1.0
    required_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    non_empty_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_checks:
      - model_output_status
    changed_file_policy:
      require_actual_diff: true
      require_non_empty: true
      allowed_patterns:
        - examples/tiny-python-fix/calculator.py

  public_docs:
    description: Verify public operating docs exist.
    commands:
      - name: verify_public_docs
        command: python -c "from pathlib import Path; docs=('docs/ai/START_HERE.md','docs/ai/DECISIONS.md','docs/ai/PROJECT_MAP.md','docs/ai/ROADMAP_STATUS.md'); missing=[p for p in docs if not Path(p).read_text(encoding='utf-8').strip()]; raise SystemExit(1 if missing else 0)"
        cwd: .
        required: true
        weight: 1.0

  docs_only:
    description: Docs-only acceptance profile for bounded public documentation updates.
    policy_pack:
      name: docs_only
    commands:
      - name: verify_public_docs
        command: python -c "from pathlib import Path; docs=('README.md','docs/ai/START_HERE.md','docs/ai/DECISIONS.md','docs/ai/PROJECT_MAP.md','docs/ai/ROADMAP_STATUS.md'); missing=[p for p in docs if not Path(p).is_file() or not Path(p).read_text(encoding='utf-8').strip()]; raise SystemExit(1 if missing else 0)"
        cwd: .
        required: true
        weight: 1.0
      - name: recipe_policy_discovery_tests
        command: python -m pytest tests/test_recipes.py -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 1.0
    required_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    non_empty_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_checks:
      - model_output_status
    changed_file_policy:
      require_actual_diff: true
      require_non_empty: true
      reason_codes:
        passed: docs_only.changed_files_allowed
        forbidden: docs_only.source_file_blocked
        outside_allowed_scope: docs_only.outside_allowed_scope
        empty: docs_only.changed_file_evidence_missing
        claimed_without_diff: docs_only.claimed_file_without_worktree_diff
        unreported_worktree_diff: docs_only.unreported_worktree_diff
        actual_diff_unavailable: docs_only.actual_diff_unavailable
      allowed_patterns:
        - "*.md"
        - "docs/**/*.md"
        - "examples/**/*.md"
      forbidden_patterns:
        - "src/**"
        - "tools/**"
        - "tests/**"
        - "configs/**"
        - "recipes/**"
        - "pyproject.toml"
        - "requirements.txt"

  python_package_maintenance:
    description: Package maintenance profile for bounded Python packaging, import, tool, and test updates.
    commands:
      - name: pyproject_package_metadata
        command: python -c "from pathlib import Path; import tomllib; data=tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8')); project=data.get('project', {}); assert project.get('name') == 'ai-workbench-mcp'; assert project.get('requires-python') == '>=3.11'; assert Path('src/ai_workbench_mcp/tools').is_dir(); assert Path('src/ai_workbench_mcp/py.typed').is_file(); assert Path('configs/model_registry.example.yaml').is_file(); assert 'configs/model_registry.local.yaml' in Path('.gitignore').read_text(encoding='utf-8')"
        cwd: .
        required: true
        weight: 1.0
      - name: package_import_smoke
        command: python -c "import ai_workbench_mcp; from ai_workbench_mcp import events, server; from ai_workbench_mcp.tools import model_select, validate_run; assert hasattr(server, 'register_tools'); assert hasattr(events, 'build_event'); assert hasattr(model_select, 'select_model_payload'); assert hasattr(validate_run, 'validate_run_payload')"
        cwd: .
        required: true
        weight: 1.0
      - name: full_test_suite
        command: python -m pytest -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 2.0
    required_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    non_empty_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_checks:
      - model_output_status
    changed_file_policy:
      require_actual_diff: true
      require_non_empty: true

  test_fix:
    description: Repo-target test-fix acceptance profile for bounded changes that must keep the full project test suite passing.
    policy_pack:
      name: test_fix
    task_test_command:
      required: true
      allowed_prefixes:
        - python -m pytest
        - python -m unittest
    commands:
      - name: pytest_collection
        command: python -m pytest --collect-only -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 1.0
      - name: full_test_suite
        command: python -m pytest -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 3.0
      - name: recipe_policy_discovery_tests
        command: python -m pytest tests/test_recipes.py -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 1.0
    required_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    non_empty_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_checks:
      - model_output_status
    changed_file_policy:
      require_actual_diff: true
      require_non_empty: true

  fixture_repair_proof:
    description: Focused fixture-repair proof profile for intentionally broken demo fixtures; use when the repo self-tests assert that the source fixture remains broken.
    task_test_command:
      required: true
      allowed_prefixes:
        - python -m pytest
        - python -m unittest
    commands:
      - name: recipe_policy_discovery_tests
        command: python -m pytest tests/test_recipes.py -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 1.0
      - name: validate_help
        command: python -m ai_workbench_mcp.cli validate --help
        cwd: .
        required: true
        weight: 1.0
    required_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    non_empty_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_checks:
      - model_output_status
    changed_file_policy:
      require_actual_diff: true
      require_non_empty: true
      allowed_patterns:
        - examples/**/*.py

  low_risk_coding:
    description: Low-risk coding acceptance profile for bounded implementation changes with deterministic test coverage.
    commands:
      - name: pytest_collection
        command: python -m pytest --collect-only -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 1.0
      - name: full_test_suite
        command: python -m pytest -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 3.0
      - name: workbench_tool_help_smoke
        command: python -m ai_workbench_mcp.cli validate --help
        cwd: .
        required: true
        weight: 1.0
    required_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    non_empty_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_checks:
      - model_output_status
    changed_file_policy:
      require_actual_diff: true
      require_non_empty: true

  low_risk_bug_fix:
    description: Low-risk bug-fix profile for bounded production fixes with focused regression evidence and the full suite.
    policy_pack:
      name: low_risk_bug_fix
    task_test_command:
      required: true
      allowed_prefixes:
        - python -m pytest
        - python -m unittest
    commands:
      - name: pytest_collection
        command: python -m pytest --collect-only -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 1.0
      - name: full_test_suite
        command: python -m pytest -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 3.0
      - name: workbench_tool_help_smoke
        command: python -m ai_workbench_mcp.cli validate --help
        cwd: .
        required: true
        weight: 1.0
    required_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    non_empty_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_checks:
      - model_output_status
    changed_file_policy:
      require_actual_diff: true
      require_non_empty: true
      allowed_patterns:
        - "src/**/*.py"
        - "tools/*.py"
        - "tests/**/*.py"
        - "examples/**/*.py"
        - "docs/**/*.md"
        - "README.md"

  api_contract_change:
    description: API and MCP contract change profile requiring contract-focused tests plus the full suite.
    policy_pack:
      name: api_contract_change
    commands:
      - name: contract_tests
        command: python -m pytest tests/test_contracts.py tests/test_server.py tests/test_mcp_runtime.py -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 2.0
      - name: full_test_suite
        command: python -m pytest -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 3.0
    required_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    non_empty_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_checks:
      - model_output_status
    changed_file_policy:
      require_actual_diff: true
      require_non_empty: true
      allowed_patterns:
        - "src/ai_workbench_mcp/**/*.py"
        - "tools/*.py"
        - "tests/**/*.py"
        - "configs/**/*.yaml"
        - "recipes/**/*.yaml"
        - "docs/**/*.md"
        - "README.md"
        - "pyproject.toml"
        - "server.json"

  security_privacy_sensitive:
    description: Security and privacy-sensitive change profile requiring hygiene checks, prompt coverage, and the full suite before review.
    policy_pack:
      name: security_privacy_sensitive
    commands:
      - name: security_prompt_catalog
        command: python -c "from pathlib import Path; assert Path('prompts/approved/security_privacy_risk_review.md').is_file(); assert Path('docs/concepts/how-acceptance-works.md').is_file()"
        cwd: .
        required: true
        weight: 1.0
      - name: public_hygiene_tests
        command: python -m pytest tests/test_public_hygiene.py tests/test_prompt_library.py -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 2.0
      - name: full_test_suite
        command: python -m pytest -q -p no:cacheprovider
        cwd: .
        required: true
        weight: 3.0
    required_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    non_empty_artifacts:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_checks:
      - model_output_status
    changed_file_policy:
      require_actual_diff: true
      require_non_empty: true
      allowed_patterns:
        - "src/**/*.py"
        - "tools/*.py"
        - "tests/**/*.py"
        - "configs/**/*.yaml"
        - "prompts/**/*.md"
        - "docs/**/*.md"
        - "README.md"
        - "pyproject.toml"
        - "server.json"
      forbidden_patterns:
        - ".env"
        - ".env.*"
        - "runs/**"
        - "configs/model_registry.local.yaml"
