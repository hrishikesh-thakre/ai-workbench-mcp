schema_version: 1
# Per-pack version tracks the policy metadata contract introduced in v0.2.
# v0.4 productized and validated the catalog without changing that schema.
policy_packs:
  docs_only:
    name: docs_only
    version: v0.2
    allowed_files:
      - "*.md"
      - "docs/**/*.md"
      - "examples/**/*.md"
    required_tests:
      - verify_public_docs
      - recipe_policy_discovery_tests
    required_evidence:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_triggers:
      - model_output_status
      - captured_response_format
    blocker_rules:
      - source_or_config_file_changed
      - changed_file_evidence_missing
      - claimed_file_without_worktree_diff
      - unreported_worktree_diff
    reason_codes:
      accepted: docs_only.accepted
      required_test_missing: docs_only.required_test_missing
      required_test_failed: docs_only.required_test_failed
      required_tests_passed: docs_only.required_tests_passed

  low_risk_bug_fix:
    name: low_risk_bug_fix
    version: v0.2
    allowed_files:
      - "src/**/*.py"
      - "tools/*.py"
      - "tests/**/*.py"
      - "examples/**/*.py"
      - "docs/**/*.md"
      - "README.md"
    required_tests:
      - task_test_command
      - pytest_collection
      - full_test_suite
      - workbench_tool_help_smoke
    required_evidence:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_triggers:
      - model_output_status
      - captured_response_format
      - regression_test_missing
    blocker_rules:
      - task_test_command_missing
      - task_test_command_failed
      - full_suite_failed
      - changed_file_evidence_missing
      - unreported_worktree_diff
    reason_codes:
      accepted: low_risk_bug_fix.accepted
      required_test_missing: low_risk_bug_fix.required_test_missing
      required_test_failed: low_risk_bug_fix.required_test_failed
      required_tests_passed: low_risk_bug_fix.required_tests_passed

  test_fix:
    name: test_fix
    version: v0.2
    allowed_files:
      - "src/**/*.py"
      - "tools/*.py"
      - "tests/**/*.py"
      - "examples/**/*.py"
      - "docs/**/*.md"
    required_tests:
      - task_test_command
      - pytest_collection
      - full_test_suite
      - recipe_policy_discovery_tests
    required_evidence:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_triggers:
      - model_output_status
      - captured_response_format
      - focused_test_command_missing
    blocker_rules:
      - task_test_command_missing
      - task_test_command_failed
      - full_suite_failed
      - changed_file_evidence_missing
      - unreported_worktree_diff
    reason_codes:
      accepted: test_fix.accepted
      required_test_missing: test_fix.required_test_missing
      required_test_failed: test_fix.required_test_failed
      required_tests_passed: test_fix.required_tests_passed

  api_contract_change:
    name: api_contract_change
    version: v0.2
    allowed_files:
      - "src/ai_workbench_mcp/**/*.py"
      - "tools/*.py"
      - "tests/**/*.py"
      - "configs/**/*.yaml"
      - "recipes/**/*.yaml"
      - "docs/**/*.md"
      - "README.md"
      - "pyproject.toml"
      - "server.json"
    required_tests:
      - contract_tests
      - full_test_suite
    required_evidence:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_triggers:
      - model_output_status
      - captured_response_format
      - api_contract_surface_changed
    blocker_rules:
      - contract_tests_missing
      - contract_tests_failed
      - full_suite_failed
      - changed_file_evidence_missing
      - unreported_worktree_diff
    reason_codes:
      accepted: api_contract_change.accepted
      required_test_missing: api_contract_change.contract_test_missing
      required_test_failed: api_contract_change.required_test_failed
      required_tests_passed: api_contract_change.required_tests_passed

  security_privacy_sensitive:
    name: security_privacy_sensitive
    version: v0.2
    allowed_files:
      - "src/**/*.py"
      - "tools/*.py"
      - "tests/**/*.py"
      - "configs/**/*.yaml"
      - "prompts/**/*.md"
      - "docs/**/*.md"
      - "README.md"
      - "pyproject.toml"
      - "server.json"
    required_tests:
      - security_prompt_catalog
      - public_hygiene_tests
      - full_test_suite
    required_evidence:
      - model_selection.json
      - model_output.md
      - run_log.jsonl
    review_triggers:
      - model_output_status
      - captured_response_format
      - alternate_model_review
      - high_risk_or_security_privacy_prompt
    blocker_rules:
      - public_hygiene_failed
      - full_suite_failed
      - private_or_secret_file_changed
      - changed_file_evidence_missing
      - unreported_worktree_diff
    reason_codes:
      accepted: security_privacy_sensitive.validation_passed
      required_test_missing: security_privacy_sensitive.required_test_missing
      required_test_failed: security_privacy_sensitive.required_test_failed
      required_tests_passed: security_privacy_sensitive.required_tests_passed
