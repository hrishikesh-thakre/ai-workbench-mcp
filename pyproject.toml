[project]
name = "ai-workbench-mcp"
version = "0.2.0a0"
description = "Goose-first acceptance, validation, routing, and audit layer for agentic work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.25.0,<2"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.scripts]
ai-workbench-mcp = "ai_workbench_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
