[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workbench-mcp"
version = "0.3.0a0"
description = "Goose-first acceptance, validation, routing, and audit layer for agentic work."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["mcp>=1.25.0,<2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/hrishikesh-thakre/ai-workbench-mcp"
Repository = "https://github.com/hrishikesh-thakre/ai-workbench-mcp"
Issues = "https://github.com/hrishikesh-thakre/ai-workbench-mcp/issues"
Documentation = "https://github.com/hrishikesh-thakre/ai-workbench-mcp#readme"

[project.scripts]
ai-workbench-mcp = "ai_workbench_mcp.server:main"
ai-workbench-bootstrap = "ai_workbench_mcp.tools.bootstrap_assets:bootstrap_main"
ai-workbench-bootstrap-assets = "ai_workbench_mcp.tools.bootstrap_assets:main"

[project.optional-dependencies]
dev = ["pytest"]
publish = ["build", "twine"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_workbench_mcp*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ai_workbench_mcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
